<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>姓名 - 目标岗位简历</title>
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 210mm; background: #fff; }
    body {
      color: #161616;
      font-family: "Songti SC", "STSong", "SimSun", serif;
      font-size: 10.5pt;
      line-height: 1.45;
    }
    main {
      width: 210mm;
      min-height: 297mm;
      padding: 11mm 13mm 10mm;
    }
    header { text-align: center; margin-bottom: 3mm; }
    h1 { font-size: 19pt; letter-spacing: 2px; line-height: 1.2; }
    .contact { margin-top: 1.5mm; font-size: 10pt; }
    .contact span + span::before { content: "｜"; margin: 0 1.2mm; color: #666; }
    section { margin-top: 2.7mm; }
    h2 {
      font-size: 12.5pt;
      line-height: 1.2;
      padding-bottom: .9mm;
      border-bottom: 1.2px solid #222;
      margin-bottom: 1.6mm;
    }
    .entry { margin-bottom: 1.8mm; break-inside: avoid; }
    .entry:last-child { margin-bottom: 0; }
    .entry-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 4mm;
      font-weight: 700;
    }
    .entry-main { min-width: 0; }
    .role::before { content: "｜"; margin: 0 1mm; font-weight: 400; }
    time { flex: 0 0 auto; white-space: nowrap; font-weight: 400; }
    ul { list-style: none; margin-top: .6mm; }
    li { position: relative; padding-left: 4.5mm; margin-bottom: .5mm; text-align: justify; }
    li::before { content: "●"; position: absolute; left: .5mm; top: .1mm; font-size: 6.5pt; }
    .kv { margin-bottom: .5mm; text-align: justify; }
    strong { font-weight: 700; }
  </style>
</head>
<body>
<main>
  <!-- Resume Tailor 结构示例。复制到本轮工作目录后替换全部示例内容，并删除空区块。 -->
  <header>
    <h1>姓名</h1>
    <div class="contact"><span>手机</span><span>邮箱</span><span>城市</span></div>
  </header>

  <section>
    <h2>教育背景</h2>
    <div class="entry">
      <div class="entry-head">
        <div class="entry-main">学校名称<span class="role">专业 · 学历</span></div>
        <time>YYYY.MM–YYYY.MM</time>
      </div>
      <div class="kv"><strong>学业信息：</strong>GPA、排名或相关课程（可选）</div>
    </div>
  </section>

  <section>
    <h2>核心经历</h2>
    <div class="entry">
      <div class="entry-head">
        <div class="entry-main">组织或项目名称<span class="role">真实角色</span></div>
        <time>YYYY.MM–YYYY.MM</time>
      </div>
      <ul>
        <li><strong>能力主题：</strong>动作、对象/方法、个人贡献与可核实结果。</li>
        <li><strong>能力主题：</strong>第二条与目标岗位相关的真实证据。</li>
      </ul>
    </div>
  </section>

  <section>
    <h2>荣誉与技能</h2>
    <div class="kv"><strong>荣誉：</strong>奖项全称、级别与时间（可选）。</div>
    <div class="kv"><strong>技能：</strong>工具或方法及实际能力边界。</div>
    <div class="kv"><strong>语言与证书：</strong>已取得的等级、分数或证书（可选）。</div>
    <!-- 用户明确选择且有事实支撑时才添加自我评价。 -->
  </section>
</main>
</body>
</html>
