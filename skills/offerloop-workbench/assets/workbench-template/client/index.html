<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    rel="icon"
    type="image/svg+xml"
    href="/favicon.svg"
  >
  <title>OfferLoop</title>
  <style>
    .offerloop-boot {
      min-height: 100vh;
      color: #1f2329;
      background: #f5f6f7;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
    }

    .offerloop-boot__sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 248px;
      background: #1f2329;
    }

    .offerloop-boot__brand {
      display: flex;
      align-items: center;
      gap: 9px;
      height: 57px;
      margin: 0 10px;
      padding: 0 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 13.5px;
      font-weight: 600;
    }

    .offerloop-boot__mark {
      width: 30px;
      height: 30px;
      border-radius: 8px;
    }

    .offerloop-boot__nav {
      display: flex;
      align-items: center;
      height: 32px;
      margin: 10px;
      padding: 0 8px;
      border-radius: 6px;
      color: #fff;
      background: rgba(51, 112, 255, 0.2);
      font-size: 13px;
    }

    .offerloop-boot__main {
      min-height: 100vh;
      margin-left: 248px;
      background: #f5f6f7;
    }

    .offerloop-boot__top {
      height: 50px;
      border-bottom: 1px solid #e5e6eb;
      background: #fff;
    }

    .offerloop-boot__content {
      padding: 28px 32px;
    }

    .offerloop-boot__line,
    .offerloop-boot__panel {
      overflow: hidden;
      background: linear-gradient(
        90deg,
        #f2f3f5 25%,
        #e9ebef 37%,
        #f2f3f5 63%
      );
      background-size: 400% 100%;
      animation: offerloop-boot-shimmer 1.4s ease infinite;
    }

    .offerloop-boot__line {
      width: 220px;
      height: 34px;
      border-radius: 8px;
    }

    .offerloop-boot__title {
      margin: 0;
      font-size: 28px;
      line-height: 34px;
    }

    .offerloop-boot__subtitle {
      width: 180px;
      height: 16px;
      margin-top: 12px;
    }

    .offerloop-boot__subtitle-text {
      margin: 6px 0 0;
      color: #8f959e;
      font-size: 13px;
    }

    .offerloop-boot__grid {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(280px, 1fr);
      gap: 20px;
      margin-top: 28px;
    }

    .offerloop-boot__panel {
      height: 300px;
      border: 1px solid #e5e6eb;
      border-radius: 14px;
    }

    .offerloop-boot__card {
      box-sizing: border-box;
      height: 300px;
      padding: 20px;
      border: 1px solid #e5e6eb;
      border-radius: 14px;
      background: #fff;
    }

    .offerloop-boot__card h2 {
      margin: 0;
      font-size: 18px;
    }

    .offerloop-boot__schedule {
      max-height: 212px;
      margin-top: 16px;
      padding-right: 4px;
      overflow-y: auto;
    }

    .offerloop-boot__event {
      display: flex;
      gap: 12px;
      align-items: center;
      min-height: 48px;
      margin-bottom: 8px;
      padding: 8px 12px;
      border: 1px solid #e5e6eb;
      border-radius: 10px;
    }

    .offerloop-boot__event-icon {
      color: #3370ff;
      font-size: 20px;
    }

    .offerloop-boot__event-title {
      margin: 0;
      overflow: hidden;
      font-size: 14px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .offerloop-boot__event-meta {
      margin: 3px 0 0;
      color: #8f959e;
      font-size: 12px;
    }

    .offerloop-boot__metrics {
      margin-top: 18px;
    }

    .offerloop-boot__metric {
      display: grid;
      grid-template-columns: 72px 44px 1fr;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
      font-size: 13px;
    }

    .offerloop-boot__metric strong {
      font-size: 14px;
    }

    .offerloop-boot__metric-bar {
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #f2f3f5;
    }

    .offerloop-boot__metric-fill {
      height: 100%;
      border-radius: inherit;
      background: #3370ff;
    }

    @keyframes offerloop-boot-shimmer {
      0% {
        background-position: 100% 0;
      }

      100% {
        background-position: 0 0;
      }
    }

    @media (max-width: 767px) {
      .offerloop-boot__sidebar {
        display: none;
      }

      .offerloop-boot__main {
        margin-left: 0;
      }

      .offerloop-boot__grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script>
    try {
      window.__platform__ = JSON.parse('{{{__platform__}}}');
    } catch (e) {
      console.error('Failed to parse __platform__', e);
    }
  </script>
  <script>
    (function () {
      var basePath = String(
        window.__BASENAME__
        || window.location.pathname
      ).replace(/\/$/, '');
      window.__offerloopHomePromise = fetch(
        basePath + '/api/workbench/home',
        {
          credentials: 'include',
          headers: {
            'X-Page-Route': window.location.pathname,
            'X-Suda-Csrf-Token': window.csrfToken || ''
          }
        }
      ).then(function (response) {
        if (!response.ok) throw new Error('home request failed');
        return response.json();
      });
    })();
  </script>
</head>

<body>
  <div id="root">
    <div class="offerloop-boot" aria-label="OfferLoop 正在加载">
      <aside class="offerloop-boot__sidebar">
        <div class="offerloop-boot__brand">
          <img
            class="offerloop-boot__mark"
            src="/favicon.svg"
            alt=""
          >
          <span>OfferLoop</span>
        </div>
        <div class="offerloop-boot__nav">OfferLoop 工作台</div>
      </aside>
      <main class="offerloop-boot__main">
        <div class="offerloop-boot__top"></div>
        <div class="offerloop-boot__content">
          <div id="offerloop-boot-title" class="offerloop-boot__line"></div>
          <div
            id="offerloop-boot-subtitle"
            class="offerloop-boot__line offerloop-boot__subtitle"
          ></div>
          <div class="offerloop-boot__grid">
            <div id="offerloop-boot-schedule" class="offerloop-boot__panel"></div>
            <div id="offerloop-boot-metrics" class="offerloop-boot__panel"></div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script>
    (function () {
      function cellText(value) {
        if (value === null || value === undefined) return '';
        if (typeof value !== 'object') return String(value).trim();
        if (Array.isArray(value)) {
          return value.map(cellText).filter(Boolean).join('、');
        }
        var keys = ['text', 'name', 'label', 'value'];
        for (var index = 0; index < keys.length; index += 1) {
          var text = cellText(value[keys[index]]);
          if (text) return text;
        }
        return '';
      }

      function appendText(parent, tagName, className, text) {
        var element = document.createElement(tagName);
        element.className = className;
        element.textContent = text;
        parent.appendChild(element);
        return element;
      }

      function formatDate(value) {
        var text = cellText(value);
        var numeric = Number(text);
        var date = new Date(
          Number.isFinite(numeric) && text.length >= 10 ? numeric : text
        );
        if (Number.isNaN(date.getTime())) return '时间待确认';
        var month = String(date.getMonth() + 1).padStart(2, '0');
        var day = String(date.getDate()).padStart(2, '0');
        var hour = String(date.getHours()).padStart(2, '0');
        var minute = String(date.getMinutes()).padStart(2, '0');
        return month + '/' + day + ' ' + hour + ':' + minute;
      }

      function renderHome(data) {
        var scheduleCard = document.getElementById(
          'offerloop-boot-schedule'
        );
        if (
          !scheduleCard
          || document.getElementById('root').hasAttribute(
            'data-offerloop-react-ready'
          )
        ) {
          return;
        }
        var title = document.getElementById('offerloop-boot-title');
        title.className = 'offerloop-boot__title';
        title.textContent = '你好';
        var subtitle = document.getElementById('offerloop-boot-subtitle');
        subtitle.className = 'offerloop-boot__subtitle-text';
        subtitle.textContent = '专注执行每一步，离目标更近一点。';

        scheduleCard.className = 'offerloop-boot__card';
        scheduleCard.replaceChildren();
        appendText(scheduleCard, 'h2', '', '未来 7 天笔试与面试');
        var scheduleList = document.createElement('div');
        scheduleList.className = 'offerloop-boot__schedule';
        scheduleCard.appendChild(scheduleList);
        var records = (
          data.upcomingEvents
          && Array.isArray(data.upcomingEvents.records)
        ) ? data.upcomingEvents.records : [];
        records.forEach(function (record) {
          var fields = record.fields || {};
          var event = document.createElement('div');
          event.className = 'offerloop-boot__event';
          appendText(event, 'span', 'offerloop-boot__event-icon', '▣');
          var content = document.createElement('div');
          content.style.minWidth = '0';
          content.style.flex = '1';
          var company = cellText(fields['公司']);
          var role = cellText(fields['岗位']);
          appendText(
            content,
            'p',
            'offerloop-boot__event-title',
            [company, role].filter(Boolean).join(' · ') || '招聘安排'
          );
          appendText(
            content,
            'p',
            'offerloop-boot__event-meta',
            formatDate(fields['开始时间'])
              + ' · '
              + (cellText(fields['环节']) || '待确认')
          );
          event.appendChild(content);
          scheduleList.appendChild(event);
        });
        if (records.length === 0) {
          appendText(
            scheduleList,
            'p',
            'offerloop-boot__event-meta',
            '未来 7 天暂无安排'
          );
        }

        var metricsCard = document.getElementById('offerloop-boot-metrics');
        metricsCard.className = 'offerloop-boot__card';
        metricsCard.replaceChildren();
        appendText(metricsCard, 'h2', '', '求职进展概览');
        var metrics = document.createElement('div');
        metrics.className = 'offerloop-boot__metrics';
        metricsCard.appendChild(metrics);
        [
          ['发现机会', Number(data.opportunityCount || 0)],
          ['已投递', 0],
          ['笔试中', 0],
          ['面试中', 0],
          ['Offer', 0],
          ['已结束', 0]
        ].forEach(function (item) {
          var row = document.createElement('div');
          row.className = 'offerloop-boot__metric';
          appendText(row, 'span', '', item[0]);
          appendText(row, 'strong', '', String(item[1]));
          var bar = document.createElement('div');
          bar.className = 'offerloop-boot__metric-bar';
          var fill = document.createElement('div');
          fill.className = 'offerloop-boot__metric-fill';
          fill.style.width = item[0] === '发现机会' ? '100%' : '0%';
          bar.appendChild(fill);
          row.appendChild(bar);
          metrics.appendChild(row);
        });
      }

      if (window.__offerloopHomePromise) {
        window.__offerloopHomePromise.then(renderHome).catch(function () {});
      }
    })();
  </script>
  <script type="module" src="/client/src/workbench-entry.tsx"></script>
</body>

</html>
